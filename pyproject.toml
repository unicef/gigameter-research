[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gigameter-research"
version = "0.3.0.dev0"
description = "GigaMeter telemetry research: spatial geofencing, connectivity, and network diagnostics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Utku Can Ozturk" }]
dependencies = [
    "giga-spatial>=0.9.8",
    "numpy>=2.2",
    "pandas>=2.3,<4",
    "pyarrow>=17",
    "scikit-learn>=1.7",
    "plotly>=5.24",
    "timezonefinder>=8.2",
    "pytz>=2026.2",
    "pycountry>=24.6",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.61"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
    "mike>=2.2",
]
dev = ["pytest>=8.4"]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
