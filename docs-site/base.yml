site_name: Research Hub
site_description: Spatial Geofencing & Telemetry Analytics Platform
site_author: Utku Can Ozturk
copyright: Copyright &copy; UNICEF Giga 2026

repo_name: unicef/gigameter-research
repo_url: https://github.com/unicef/gigameter-research

strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.tabs.link
    - code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
  logo: gigameter_white.svg
  favicon: giga_horizontal_bicolor.svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/unicef/gigameter-research
  generator: false

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/cards.css

exclude_docs: .DS_Store

validation:
  omitted_files: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    absolute_links: warn
  links:
    absolute_links: ignore

markdown_extensions:
  pymdownx.highlight:
    anchor_linenums: true
  pymdownx.inlinehilite: {}
  pymdownx.snippets: {}
  pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format
  pymdownx.arithmatex:
    generic: true
  pymdownx.tabbed:
    alternate_style: true
  admonition: {}
  pymdownx.details: {}

plugins:
  search: {}
