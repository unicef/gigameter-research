site_name: Research Hub
site_description: Spatial Geofencing & Telemetry Analytics Platform
site_author: Utku Can Ozturk

theme:
  name: material
  palette:
    # Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.tabs.link
    - code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

  logo: gigameter_white.svg
  favicon: giga_horizontal_bicolor.svg
  
repo_name: unicef/gigameter-research
repo_url: https://github.com/unicef/gigameter-research
site_url: https://unicef.github.io/gigameter-research/
edit_uri: edit/main/docs/

exclude_docs: .DS_Store

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/unicef/gigameter-research
  generator: false
  
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_options:
              returns_multiple_items: false
              returns_named_value: false
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            show_root_full_path: false
            show_signature_annotations: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/cards.css

nav:
  - Welcome: index.md

  - Spatial & Geofencing:
      - Pillars:
        - Mobility Trajectories: spatial/pillar-1-mobility.md
        - Geolocation Quality: spatial/pillar-2-quality.md
        - Govt Map Validation: spatial/pillar-3-validation.md
        - Worked Examples: spatial/examples.md
      - Blueprints:
        - Spatial & Geofencing Blueprint: blueprint/technical_blueprint.md
        - Methodology Parameters: blueprint/parameters.md
        - Research Log: blueprint/research-log.md
      - Decisions:
        - Overview: adr/index.md
        - Template: adr/0000-template.md
        - Version the agent rules: adr/0001-version-agent-rules.md
        - MkDocs source of truth: adr/0002-mkdocs-source-of-truth.md
        - Versioning and freeze: adr/0003-versioning-and-freeze.md
        - SpatialConfig single source: adr/0004-spatialconfig-single-source.md
        - Canonical loader: adr/0005-canonical-frame-and-loader.md
        - Official pins: adr/0006-official-pins-delta-sharing.md
        - Public-repo data: adr/0007-data-handling-public-repo.md
        - Schools only: adr/0008-scope-schools-only.md
        - SQL conventions: adr/0009-sql-conventions.md
        - Python and dependencies: adr/0010-python-and-dependencies.md
        - Operational hours: adr/0011-operational-hours.md
        - Time basis: adr/0012-time-basis.md
        - Canonical frame contract: adr/0013-canonical-frame-contract.md
        - Pin ownership: adr/0014-pin-ownership.md
        - Offline-row test timestamp: adr/0015-test-timestamp-offline-synced-rows.md
      - Python API Reference:
        - Overview: api/index.md
        - Data Loading: api/loading.md
        - Configuration: api/config.md
        - MobilityAnalyzer: api/mobility.md
        - SpatialProfiler: api/profiler.md
        - FacilityValidator: api/validator.md
        - Helpers & Constants: api/helpers.md
  
  - Outages & Connectivity:
      - Pillars:
        - 4-State Outage Models: connectivity/outage-models.md
  
  - Diagnostics & Routing:
      - Pillars:
        - Traceroutes & BBR: diagnostics/routing.md
  


